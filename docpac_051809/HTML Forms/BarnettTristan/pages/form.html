<!DOCTYPE html>
<head>
    <title>
        form
    </title>
</head>
<body>
    <form id="formThingy" action="/form" method="POST">
        <label for="studentName">
            Name:
            <input
                type="text"
                id="studentName"
                name="studentName" 
                required
            >
        </label>
        <label for="email">
            email:
            <input
                type="email"
                id="email"
                name="Email"
                required
            >
        </label>
        <label for="teamSize">
            Team size:
            <input
                type="number"
                max="4"
                min="1"
            >    
        </label>
        <fieldset>
            <legend>Preferred project type</legend>
            <input 
                type="radio"
                name="projectType"
                value="website"
                id="website"
            >
            <label for="website">website</label>
            <input 
                type="radio"
                name="projectType"
                value="game"
                id="game"
            >
            <label for="game">game</label>
            <input 
                type="radio"
                name="projectType"
                value="data"
                id="data"
            >
            <label for="data">data</label>
        </fieldset>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
